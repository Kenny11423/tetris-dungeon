name: Build and Package Tetris Dungeon

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    
    steps:
    - name: Install system dependencies (Arch Linux)
      run: pacman -Syu --noconfirm git jdk17-openjdk nodejs

    - name: Checkout code
      uses: actions/checkout@v4
      
    # Setup Java is not needed since we installed jdk17-openjdk via pacman
    - name: Compile Java source code
      run: |
        mkdir -p bin
        javac -d bin src/com/tetris/*.java
        
    - name: Package to JAR
      run: |
        jar cfe TetrisDungeon.jar com.tetris.Tetris -C bin .
        
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TetrisDungeon-JAR
        path: TetrisDungeon.jar

  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Compile Java source code
      run: |
        mkdir bin
        javac -d bin src/com/tetris/*.java
        
    - name: Package to JAR
      run: |
        jar cfe TetrisDungeon.jar com.tetris.Tetris -C bin .
        
    - name: Build EXE using jpackage
      run: |
        # jpackage creates an app image containing the .exe and bundled JRE
        # --win-dir-chooser and --win-shortcut flags can be added if using --type exe instead of app-image
        jpackage --type app-image --name TetrisDungeon --input . --main-jar TetrisDungeon.jar --main-class com.tetris.Tetris
        
    - name: Zip the Windows package
      run: Compress-Archive -Path TetrisDungeon -DestinationPath TetrisDungeon-Windows.zip
        
    - name: Upload Windows EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TetrisDungeon-Windows
        path: TetrisDungeon-Windows.zip
