name: Build & Package Tetris Dungeon EXE & JAR

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish GitHub Release
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile Java & Build Executable JAR
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path bin
        javac -encoding UTF-8 -cp "lib/*" -d bin src/com/tetris/*.java
        
        # Extract sqlite-jdbc into bin
        Set-Location bin
        jar xf ..\lib\sqlite-jdbc.jar
        Set-Location ..
        
        # Create manifest and build self-contained JAR
        "Main-Class: com.tetris.Tetris" | Out-File -Encoding ascii manifest.txt
        jar cvfm TetrisDungeon.jar manifest.txt -C bin .

    - name: Install Launch4j via Chocolatey
      shell: powershell
      run: |
        choco install launch4j -y

    - name: Build Single Standalone EXE (Launch4j - 14MB Standalone)
      shell: powershell
      run: |
        # Create Launch4j XML config
        Set-Content -Path launch4j_config.xml -Value '<launch4jConfig>'
        Add-Content -Path launch4j_config.xml -Value '  <dontWrapJar>false</dontWrapJar>'
        Add-Content -Path launch4j_config.xml -Value '  <headerType>gui</headerType>'
        Add-Content -Path launch4j_config.xml -Value '  <jar>TetrisDungeon.jar</jar>'
        Add-Content -Path launch4j_config.xml -Value '  <outfile>TetrisDungeon-Standalone.exe</outfile>'
        Add-Content -Path launch4j_config.xml -Value '  <errTitle>Tetris Dungeon</errTitle>'
        Add-Content -Path launch4j_config.xml -Value '  <cmdLine></cmdLine>'
        Add-Content -Path launch4j_config.xml -Value '  <chdir>.</chdir>'
        Add-Content -Path launch4j_config.xml -Value '  <priority>normal</priority>'
        Add-Content -Path launch4j_config.xml -Value '  <downloadUrl>https://java.com/download</downloadUrl>'
        Add-Content -Path launch4j_config.xml -Value '  <supportUrl></supportUrl>'
        Add-Content -Path launch4j_config.xml -Value '  <stayAlive>false</stayAlive>'
        Add-Content -Path launch4j_config.xml -Value '  <restartOnCrash>false</restartOnCrash>'
        Add-Content -Path launch4j_config.xml -Value '  <manifest></manifest>'
        Add-Content -Path launch4j_config.xml -Value '  <icon></icon>'
        Add-Content -Path launch4j_config.xml -Value '  <jre>'
        Add-Content -Path launch4j_config.xml -Value '    <path>%JAVA_HOME%</path>'
        Add-Content -Path launch4j_config.xml -Value '    <requires64Bit>false</requires64Bit>'
        Add-Content -Path launch4j_config.xml -Value '    <minVersion>1.8.0</minVersion>'
        Add-Content -Path launch4j_config.xml -Value '    <maxVersion></maxVersion>'
        Add-Content -Path launch4j_config.xml -Value '  </jre>'
        Add-Content -Path launch4j_config.xml -Value '</launch4jConfig>'
        
        # Run Launch4j binary installed via Chocolatey
        & "C:\Program Files (x86)\Launch4j\launch4j.exe" launch4j_config.xml
        
        # Copy to TetrisDungeon.exe as well
        Copy-Item TetrisDungeon-Standalone.exe -Destination TetrisDungeon.exe

    - name: Build Windows Portable App (Embedded JRE) using jpackage
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path jar_dir
        Copy-Item TetrisDungeon.jar -Destination jar_dir\
        
        jpackage --type app-image --name TetrisDungeon --input jar_dir --main-jar TetrisDungeon.jar --main-class com.tetris.Tetris --dest dist
        
        # Compress dist/TetrisDungeon folder correctly with proper relative paths
        Set-Location dist\TetrisDungeon
        Get-ChildItem -Path . | Compress-Archive -DestinationPath ..\..\TetrisDungeon-Windows-Portable.zip
        Set-Location ..\..

    - name: Upload Windows Portable Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TetrisDungeon-Windows-Portable
        path: |
          TetrisDungeon-Standalone.exe
          TetrisDungeon.exe
          TetrisDungeon-Windows-Portable.zip
          TetrisDungeon.jar

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      with:
        tag_name: latest
        name: "Tetris Dungeon Latest Release 🎮"
        body: |
          ## 🎮 Tetris Dungeon Release
          
          ### 📥 Download Links:
          - **`TetrisDungeon-Standalone.exe`**: 100% Single Standalone Windows Executable (14MB - Run anywhere without unzipping, folders or cfg files!).
          - **`TetrisDungeon.exe`**: Single Standalone Windows Executable.
          - **`TetrisDungeon-Windows-Portable.zip`**: Complete Portable Windows package with proper folder structure (Includes embedded Java runtime).
          - **`TetrisDungeon.jar`**: Cross-platform executable JAR file.
        files: |
          TetrisDungeon-Standalone.exe
          TetrisDungeon.exe
          TetrisDungeon-Windows-Portable.zip
          TetrisDungeon.jar
        overwrite: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
