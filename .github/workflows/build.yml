name: Build & Package Tetris Dungeon EXE & JAR

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish GitHub Release
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile Java & Build Executable JAR
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path bin
        javac -encoding UTF-8 -cp "lib/*" -d bin src/com/tetris/*.java
        
        # Extract sqlite-jdbc into bin
        Set-Location bin
        jar xf ..\lib\sqlite-jdbc.jar
        Set-Location ..
        
        # Create manifest and build self-contained JAR
        "Main-Class: com.tetris.Tetris" | Out-File -Encoding ascii manifest.txt
        jar cvfm TetrisDungeon.jar manifest.txt -C bin .

    - name: Build Windows Executable (TetrisDungeon.exe) using jpackage
      shell: powershell
      run: |
        # Put ONLY TetrisDungeon.jar into clean input dir for instant 5-second build
        New-Item -ItemType Directory -Force -Path jar_dir
        Copy-Item TetrisDungeon.jar -Destination jar_dir\
        
        jpackage --type app-image --name TetrisDungeon --input jar_dir --main-jar TetrisDungeon.jar --main-class com.tetris.Tetris --dest dist
        
        # Copy output TetrisDungeon.exe to root level
        Copy-Item dist\TetrisDungeon\TetrisDungeon.exe -Destination TetrisDungeon.exe
        
        # Package entire Portable Windows directory (TetrisDungeon.exe + embedded runtime) into Zip
        Compress-Archive -Path dist\TetrisDungeon\* -DestinationPath TetrisDungeon-Windows-Portable.zip

    - name: Upload Windows Portable Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TetrisDungeon-Windows-Portable
        path: |
          TetrisDungeon.exe
          TetrisDungeon-Windows-Portable.zip
          TetrisDungeon.jar

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      with:
        tag_name: latest
        name: "Tetris Dungeon Latest Release 🎮"
        body: |
          ## 🎮 Tetris Dungeon Release
          
          ### 📥 Download Links:
          - **`TetrisDungeon.exe`**: Standard Windows Executable.
          - **`TetrisDungeon-Windows-Portable.zip`**: Complete Portable Windows package (Includes embedded Java runtime, no installation required!).
          - **`TetrisDungeon.jar`**: Cross-platform executable JAR file.
        files: |
          TetrisDungeon.exe
          TetrisDungeon-Windows-Portable.zip
          TetrisDungeon.jar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
