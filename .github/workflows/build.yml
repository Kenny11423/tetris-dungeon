name: Build & Package Tetris Dungeon EXE & JAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    name: Build Windows EXE & Standalone Package
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile Java & Build Executable JAR
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path bin
        javac -encoding UTF-8 -cp "lib/*" -d bin src/com/tetris/*.java
        
        # Extract sqlite-jdbc into bin
        Set-Location bin
        jar xf ..\lib\sqlite-jdbc.jar
        Set-Location ..
        
        # Create manifest and build self-contained JAR
        "Main-Class: com.tetris.Tetris" | Out-File -Encoding ascii manifest.txt
        jar cvfm TetrisDungeon.jar manifest.txt -C bin .

    - name: Build Windows Executable (TetrisDungeon.exe) using jpackage
      shell: powershell
      run: |
        jpackage --type app-image --name TetrisDungeon --input . --main-jar TetrisDungeon.jar --main-class com.tetris.Tetris --dest dist
        
        # Copy output TetrisDungeon.exe to root level
        Copy-Item dist\TetrisDungeon\TetrisDungeon.exe -Destination TetrisDungeon.exe
        
        # Package entire Portable Windows directory (TetrisDungeon.exe + embedded runtime) into Zip
        Compress-Archive -Path dist\TetrisDungeon -DestinationPath TetrisDungeon-Windows-Portable.zip

    - name: Upload Windows Portable EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TetrisDungeon-Windows-Portable
        path: |
          TetrisDungeon.exe
          TetrisDungeon-Windows-Portable.zip

  build-jar:
    name: Build Cross-Platform JAR
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile & Build Executable JAR
      run: |
        mkdir -p bin
        javac -encoding UTF-8 -cp "lib/*" -d bin src/com/tetris/*.java
        cd bin
        jar xf ../lib/sqlite-jdbc.jar
        cd ..
        echo "Main-Class: com.tetris.Tetris" > manifest.txt
        jar cvfm TetrisDungeon.jar manifest.txt -C bin .

    - name: Upload Cross-Platform JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TetrisDungeon-JAR
        path: TetrisDungeon.jar
